[package]
name = "bendvy-iroh-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "iroh-native-probe"
path = "src/bin/native-probe.rs"
required-features = ["native-probe"]

[features]
default = []
native-probe = ["dep:tokio"]

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
n0-future = "0.3.2"
base64 = "0.22.1"
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "io-std"], optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
