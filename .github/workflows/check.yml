name: Examples
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BEND_NO_TELEMETRY: '1'
      CC: clang-19
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Install Bend 2.0.38
        shell: bash
        run: |
          archive="$RUNNER_TEMP/bend-2.0.38-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://github.com/bendlang/bend/releases/download/v2.0.38/bend-2.0.38-linux-x64.tar.gz \
            -o "$archive"
          echo "f19d088b079c9e1a8834ecd153b7d58c11a5f8f9ab1bdb78dbc96a6bf49aaa81  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "BEND=$RUNNER_TEMP/bend/bin/bend" >> "$GITHUB_ENV"
          echo "BEND_LIB=$RUNNER_TEMP/bendhub" >> "$GITHUB_ENV"
      - name: Install the pinned Bend proof-checker toolchain
        shell: bash
        run: |
          archive="$RUNNER_TEMP/elan.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o "$archive"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/elan-installer"
          tar -xzf "$archive" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --no-modify-path --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Prepare the independent Bend proof kernel
        timeout-minutes: 3
        shell: bash
        run: |
          # Build/cache Lean infrastructure before the bounded project proof gates.
          probe="$RUNNER_TEMP/bend-kernel-setup.bend"
          cat > "$probe" <<'BEND'
          import Base
          law kernel_ready: {0n == 0n : Nat}
          def kernel_ready(): {==}
          BEND
          "$BEND" "$probe" --verdict
      - name: Install native build dependencies
        timeout-minutes: 6
        run: |
          # The runner's Azure mirror can stall large compiler downloads.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y clang-19 libx11-dev libasound2-dev
      - name: Audit published dependencies
        run: python3 scripts/check-dependencies.py --registry
      - name: Install the Iroh browser build toolchain
        shell: bash
        run: |
          rustup toolchain install 1.94.0 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.94.0
          bindgen_version="$(python3 - <<'PYTHON'
          import pathlib, tomllib
          manifest = tomllib.loads(pathlib.Path('tools/iroh-transport/Cargo.toml').read_text())
          print(manifest['target']['cfg(target_arch = "wasm32")']['dependencies']['wasm-bindgen'].removeprefix('='))
          PYTHON
          )"
          cargo install wasm-bindgen-cli --version "$bindgen_version" --locked
      - name: Install pinned TypeScript and bot dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/survivors-bot --ignore-scripts --no-audit --no-fund
      - name: Install pinned Astro build dependencies
        run: npm ci --prefix examples/survivors/web --no-audit --no-fund
      - name: Check TypeScript sources, types, lint and formatting
        run: npm run check:typescript
      - name: Build using a fresh BendHub cache
        run: bash examples/survivors/build.sh
      - name: Check Bend laws and native geometry
        run: bash examples/survivors/check.sh
      - name: Build the prerendered browser page
        run: |
          bash examples/survivors/build-web.sh
      - name: Build optional bot endpoints
        run: |
          npm ci --prefix tools/survivors-bot --ignore-scripts
          bash tools/survivors-bot/check.sh
          bash tools/survivors-bot/check-visible.sh
          bash tools/survivors-bot/check-monsters.sh
      - name: Check native profile, UI and loot
        run: bash examples/survivors/check-native.sh
