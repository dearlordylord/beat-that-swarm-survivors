name: Examples
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BEND_NO_TELEMETRY: '1'
      CC: clang-19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Install Bend 2.0.38
        shell: bash
        run: |
          archive="$RUNNER_TEMP/bend-2.0.38-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://github.com/bendlang/bend/releases/download/v2.0.38/bend-2.0.38-linux-x64.tar.gz \
            -o "$archive"
          echo "f19d088b079c9e1a8834ecd153b7d58c11a5f8f9ab1bdb78dbc96a6bf49aaa81  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "BEND=$RUNNER_TEMP/bend/bin/bend" >> "$GITHUB_ENV"
          echo "BEND_LIB=$RUNNER_TEMP/bendhub" >> "$GITHUB_ENV"
      - name: Install native build dependencies
        timeout-minutes: 6
        run: |
          # The runner's Azure mirror can stall large compiler downloads.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y clang-19 libx11-dev libasound2-dev
      - name: Audit published dependencies
        run: python3 scripts/check-dependencies.py --registry
      - name: Check portable timeout helper
        run: node examples/run-bounded.test.mjs
      - name: Install pinned Astro build dependencies
        run: npm ci --prefix examples/survivors/web --no-audit --no-fund
      - name: Build using a fresh BendHub cache
        run: bash examples/survivors/build.sh
      - name: Check gameplay and browser-side progression
        run: bash examples/survivors/check.sh
      - name: Build the prerendered browser page
        run: |
          bash examples/survivors/build-web.sh
          node examples/survivors/launcher.test.mjs
      - name: Check optional classifier bot offline
        run: |
          npm ci --prefix tools/survivors-bot --ignore-scripts
          bash tools/survivors-bot/check.sh
          bash tools/survivors-bot/check-visible.sh
          bash tools/survivors-bot/check-monsters.sh
      - name: Check native profile, UI and application build
        run: bash examples/survivors/check-native.sh
