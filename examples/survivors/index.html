<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#11151d" />
    <title>Survivors · Moon Seal menu themes</title>
    <meta name="description" content="A Vampire Survivors clone built as a Bendvy ECS example." />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./menu-a.css" />
    <link rel="stylesheet" href="./moon-menu-prototype/base.css" />
    <link rel="stylesheet" href="./moon-menu-prototype/stone.css" />
    <link rel="stylesheet" href="./moon-menu-prototype/bone.css" />
    <link rel="stylesheet" href="./moon-menu-prototype/velvet.css" />
    <link rel="stylesheet" href="./moon-menu-prototype/seal.css" />
  </head>
  <body>
    <main id="app">
      <canvas
        id="game"
        width="1024"
        height="640"
        aria-label="Nightfall Survivors game field"
        tabindex="0"
      ></canvas>
      <div id="hud" hidden>
        <div class="topline">
          <span class="brand">Nightfall Survivors</span
          ><span id="clock">00:00</span><span id="gold"></span
          ><button id="map" aria-label="Open arena map">Map [M]</button><button id="pause" aria-label="Pause">Ⅱ</button>
        </div>
        <div class="xp"><i id="xpFill"></i><span id="level"></span></div>
        <div class="health">
          <i id="hpFill"></i><span id="healthText"></span>
        </div>
        <div id="loadout"></div>
        <div id="runStats"></div>
      </div>
      <section id="menu" class="screen">
        <div class="menu-wrap">
          <header class="menu-header">
            <div class="menu-brand"><span class="brand-mark" aria-hidden="true">✦</span><div><strong>Survivors</strong><small>Bendvy ECS example</small></div></div>
          <div class="source-links" aria-label="Source repositories">
            <a href="https://github.com/dearlordylord/bendvy-ecs-examples/tree/main/examples/survivors" target="_blank" rel="noopener noreferrer" aria-label="Game example on GitHub" title="Game example on GitHub"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M12 .75a11.25 11.25 0 0 0-3.558 21.923c.563.104.768-.244.768-.542 0-.267-.01-.975-.015-1.914-3.13.68-3.79-1.508-3.79-1.508-.512-1.3-1.25-1.647-1.25-1.647-1.022-.7.078-.686.078-.686 1.13.08 1.724 1.16 1.724 1.16 1.005 1.722 2.636 1.225 3.278.937.103-.728.393-1.225.715-1.507-2.499-.284-5.126-1.25-5.126-5.564 0-1.23.44-2.236 1.16-3.023-.116-.284-.503-1.43.11-2.98 0 0 .945-.303 3.094 1.155a10.79 10.79 0 0 1 5.625 0c2.148-1.458 3.092-1.155 3.092-1.155.615 1.55.228 2.696.113 2.98.722.787 1.158 1.793 1.158 3.023 0 4.325-2.631 5.277-5.138 5.555.404.349.765 1.036.765 2.088 0 1.507-.014 2.724-.014 3.094 0 .301.202.651.774.541A11.252 11.252 0 0 0 12 .75Z"/></svg><span>Example</span></a>
            <a href="https://github.com/dearlordylord/bendvy" target="_blank" rel="noopener noreferrer" aria-label="Bendvy on GitHub" title="Bendvy on GitHub"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M12 .75a11.25 11.25 0 0 0-3.558 21.923c.563.104.768-.244.768-.542 0-.267-.01-.975-.015-1.914-3.13.68-3.79-1.508-3.79-1.508-.512-1.3-1.25-1.647-1.25-1.647-1.022-.7.078-.686.078-.686 1.13.08 1.724 1.16 1.724 1.16 1.005 1.722 2.636 1.225 3.278.937.103-.728.393-1.225.715-1.507-2.499-.284-5.126-1.25-5.126-5.564 0-1.23.44-2.236 1.16-3.023-.116-.284-.503-1.43.11-2.98 0 0 .945-.303 3.094 1.155a10.79 10.79 0 0 1 5.625 0c2.148-1.458 3.092-1.155 3.092-1.155.615 1.55.228 2.696.113 2.98.722.787 1.158 1.793 1.158 3.023 0 4.325-2.631 5.277-5.138 5.555.404.349.765 1.036.765 2.088 0 1.507-.014 2.724-.014 3.094 0 .301.202.651.774.541A11.252 11.252 0 0 0 12 .75Z"/></svg><span>Bendvy</span></a>
          </div>
          </header>
          <nav id="tabs">
            <button data-tab="expedition" class="active">Expedition</button
            ><button data-tab="shop">Legacy</button
            ><button data-tab="collection">Collection</button
            ><button data-tab="achievements">Achievements</button
            ><button data-tab="settings">Settings</button>
          </nav>
          <div id="wallet"></div>
          <div id="menuContent"></div>
          <footer>
            WASD / arrow keys to move · M for map · Esc / Space to pause · attacks are
            automatic<br />Experience unlocks abilities. Chests awaken
            evolutions.
          </footer>


        </div>
      </section>
      <section id="overlay" class="screen" hidden>
        <div
          id="dialog"
          class="dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="dialog-title"
          tabindex="-1"
        ></div>
      </section>
      <div id="toast" role="status"></div>
      <div id="joystick" hidden><div id="stick"></div></div>
      <div id="error" hidden role="alert"></div>
    </main>
    <aside id="theme-switcher" aria-label="Moon Seal menu themes"></aside>
    <dialog id="theme-preview"></dialog>
    <script type="module" src="./moon-menu-prototype/main.mjs"></script>
  </body>
</html>
